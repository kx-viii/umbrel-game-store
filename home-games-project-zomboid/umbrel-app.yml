manifestVersion: 1.1
id: home-games-project-zomboid
category: gaming
name: Project Zomboid
version: "42.21-3"
tagline: A modded Project Zomboid world that stays online
icon: https://raw.githubusercontent.com/kx-viii/umbrel-game-store/main/home-games-project-zomboid/icon.png
description: >-
  A Project Zomboid (Build 42) dedicated server running the Project Viewpoint Vanilla+ modpack by OwenOasis.
  Open this app for a dashboard: status and uptime, a live map of where everyone is, the mod list,
  a settings editor for the server and sandbox options, the server console, restarts with in-game
  warnings, and world backups to download.


  The first start downloads about 3 GB of mods from the Steam Workshop and can take 20 minutes or more.
  Players need the same mods: subscribe to the collection and set up ZombieBuddy, as for single player.


  The mod list is in hooks/zomboid/mods.txt (load order) and hooks/zomboid/workshop.txt (Workshop items) in the app.
  The server's game version must match the players', so the app needs an update when Project Zomboid updates.


  Players on your home network or Tailscale can join straight away. For players elsewhere the app runs a playit.gg tunnel:
  add its secret key as the custom environment variable SECRET_KEY on the playit service in the app's settings,
  then put the tunnel's address in the dashboard's Join box.

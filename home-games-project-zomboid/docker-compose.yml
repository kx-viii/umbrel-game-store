version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: home-games-project-zomboid_web_1
      APP_PORT: 8080
      # Keeps the Umbrel login in front of the page, since it shows the passwords

  server:
    # The game version must match the players' game, so bump this tag when Project Zomboid updates
    image: danixu86/project-zomboid-dedicated-server:42.21-release-2@sha256:c165eb74027339bb22bc9a39ae352aa616c1fdd6983c8ec76420b643f1acd456
    # start.sh sets the passwords, mod lists and ZombieBuddy, then runs the image's entry script
    entrypoint: ["/bin/bash", "/umbrel/start.sh"]
    environment:
      - SERVERNAME=home
      - DISPLAYNAME=Home
      - PUBLIC=false
      - MIN_MEMORY=2048m
      - MAX_MEMORY=8192m
    ports:
      - 16261:16261/udp
      - 16262:16262/udp
    volumes:
      # World, server settings, logs and the passwords file
      - ${APP_DATA_DIR}/data/zomboid:/home/steam/Zomboid
      # Downloaded workshop mods
      - ${APP_DATA_DIR}/data/workshop:/home/steam/pz-dedicated/steamapps/workshop
      # The app's own files live in hooks/zomboid: when Umbrel updates an app it only copies
      # docker-compose.yml, exports.sh, torrc, *.template and the hooks folder
      - ${APP_DATA_DIR}/hooks/zomboid/start.sh:/umbrel/start.sh:ro
      - ${APP_DATA_DIR}/hooks/zomboid/mods.txt:/umbrel/mods.txt:ro
      - ${APP_DATA_DIR}/hooks/zomboid/workshop.txt:/umbrel/workshop.txt:ro
      - ${APP_DATA_DIR}/hooks/zomboid/umbrel-live.lua:/umbrel/umbrel-live.lua:ro
    # Gives the server time to save the world on stop
    stop_grace_period: 3m
    # The dashboard's Restart button saves and quits the server, and this brings it back.
    # Stopping the app in Umbrel still stops it for good.
    restart: unless-stopped

  web:
    # The dashboard: status, live map, mods, settings, console and backups (hooks/zomboid/dashboard/server.py)
    image: python:3.12.12-alpine3.22@sha256:848ba4413eb897e225159b8fc1b02094576cbae4aa73fc13142608ae2c8c0e32
    command: ["python", "-u", "/umbrel/dashboard/server.py"]
    # The game server's user, so settings it edits keep the right owner
    user: "1000:1000"
    # The read-only public map, on the Umbrel itself only. To share it outside, run in the
    # Tailscale app's terminal: tailscale funnel --bg --https=10000 http://127.0.0.1:8489
    ports:
      - "127.0.0.1:8489:8081"
    environment:
      - SERVERNAME=home
      - GAME_PORT=16261
      - GAME_VERSION=42.21
      - RCON_HOST=home-games-project-zomboid_server_1
      - RCON_PORT=27015
      - COLLECTION=3812346398
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ${APP_DATA_DIR}/hooks/zomboid/dashboard:/umbrel/dashboard:ro
      - ${APP_DATA_DIR}/hooks/zomboid/mods.txt:/umbrel/mods.txt:ro
      - ${APP_DATA_DIR}/hooks/zomboid/workshop.txt:/umbrel/workshop.txt:ro
      # Read-write for the settings editor and the map tile cache
      - ${APP_DATA_DIR}/data/zomboid:/zomboid
      - ${APP_DATA_DIR}/data/workshop:/workshop:ro
    restart: on-failure

  playit:
    # A playit.gg tunnel, so friends outside the home network can join without opening router
    # ports or seeing the home IP. Its secret key is a custom environment variable (SECRET_KEY)
    # in the app's Umbrel settings, never in this repo. Until it's set, the agent waits.
    image: ghcr.io/playit-cloud/playit-agent:1.0.12@sha256:5b7748d3e8564f1cac3d3a295a23640136fbf774c76a9509bd262d16b324b06b
    # Host networking so tunnels can point at 127.0.0.1:16261, the server's published port
    network_mode: host
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$${SECRET_KEY}" ]; then
          echo "No playit secret key set yet; waiting"
          exec sleep 2147483647
        fi
        exec /playit/entrypoint.sh
    restart: on-failure
